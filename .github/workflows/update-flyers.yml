name: Update flyer data

on:
  schedule:
    # 23:00 UTC = 8:00 JST（毎朝）
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update flyers.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-flyers.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flyers.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update flyer data ($(date -u +%Y-%m-%d))"
            git push
          fi
