<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筑紫野・太宰府 スーパー特売チェッカー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f7f5f0;
    color: #2b2620;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .updated { color: #7a7266; font-size: 13px; }

  /* 本日の最安ハイライト */
  .hero-heading {
    font-size: 15px;
    font-weight: 800;
    margin: 18px 0 10px;
  }
  .hero-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .hero-card {
    flex: 0 0 auto;
    width: 138px;
    border-radius: 16px;
    padding: 12px 12px 10px;
    color: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }
  .hero-icon { font-size: 26px; line-height: 1; }
  .hero-category { font-size: 11px; opacity: 0.9; margin-top: 4px; font-weight: 600; }
  .hero-name {
    font-size: 12.5px;
    font-weight: 700;
    margin-top: 6px;
    line-height: 1.3;
    min-height: 2.6em;
  }
  .hero-price { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .hero-unit { font-size: 10px; opacity: 0.85; font-weight: 500; }
  .hero-store { font-size: 10.5px; margin-top: 6px; opacity: 0.95; display: flex; align-items: center; gap: 4px; }
  .hero-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex: 0 0 auto; }

  /* カテゴリ別比較 */
  .category-section { margin-bottom: 20px; }
  .category-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    margin: 0 0 10px;
  }
  .category-title .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    font-size: 16px;
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .store-col {
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-top: 4px solid var(--store-color, #b5590a);
  }
  .store-col h4 {
    margin: 0 0 8px;
    font-size: 12.5px;
    color: #55504a;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .store-col h4 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--store-color, #b5590a);
    flex: 0 0 auto;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px dashed #eee;
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { flex: 1; line-height: 1.35; }
  .item-price { font-weight: 800; color: #b5590a; white-space: nowrap; font-size: 14.5px; }
  .item-price.cheapest { color: #1a7a3c; }
  .item-price.cheapest::before { content: "👑 "; font-size: 11px; }
  .item-unit { color: #999; font-size: 10.5px; margin-left: 2px; font-weight: 500; }
  .no-items { color: #bbb; font-size: 12px; }

  .notice {
    background: #fff6ea;
    border: 1px solid #f0d9a8;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: #6b5a2f;
    margin-bottom: 4px;
    line-height: 1.6;
  }

  /* フォールバック（画像リンクのみ）表示 */
  .store {
    background: #fff;
    border: 1px solid #e6e0d4;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .store-head {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #faf8f3;
    border-bottom: 1px solid #e6e0d4;
    gap: 12px;
    flex-wrap: wrap;
  }
  .store-head h3 { margin: 0; font-size: 14px; }
  .status-na { color: #a0522d; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .na-box { padding: 12px 16px; font-size: 13px; color: #5a5348; line-height: 1.6; }
  .na-box a {
    display: inline-block;
    margin-top: 6px;
    color: #b5590a;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #f0c48a;
    background: #fff3e0;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
  }
  .na-box a:hover { background: #ffe6bf; }

  h2.section-heading { font-size: 13px; color: #7a7266; margin: 22px 0 10px; font-weight: 700; }
  .source-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .source-links a {
    display: inline-block;
    color: #6b5a2f;
    text-decoration: none;
    border: 1px solid #e6e0d4;
    background: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
  }
  .source-links a:hover { background: #faf8f3; }

  footer { font-size: 11px; color: #999; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 筑紫野・太宰府 スーパー特売チェッカー</h1>
    <div class="updated" id="updatedLine">読み込み中...</div>
  </header>

  <div class="notice" id="noticeBox">
    毎朝、各店のチラシから目玉商品・価格をAIで自動的に読み取って表示しています。読み取れなかった店舗は元チラシへのリンクを表示します。
  </div>

  <div id="heroContainer"></div>

  <div id="categoriesContainer"></div>

  <div id="fallbackContainer"></div>

  <div id="sourceLinksContainer"></div>

  <footer>
    データ出典: くふうトクバイ（tokubai.co.jp）、Shufoo!（shufoo.net）、チラシガイド（chirashi-guide.com）。価格・商品はAIによる自動読み取りのため、実際のチラシ・店頭表示と異なる場合があります。最終的な価格は必ず元チラシでご確認ください。
  </footer>
</div>

<script>
const STORE_LINK_LABEL = {
  "meijiya-dazaifu": "チラシガイドで見る",
  "yumetown-chikushino": "トクバイで見る",
  "ropia-chikushino": "トクバイで見る",
  "marukyo-harada": "Shufoo!で見る",
  "direx-hara": "トクバイで見る",
};

const STORE_COLOR = {
  "meijiya-dazaifu": "#b5590a",
  "yumetown-chikushino": "#1565c0",
  "ropia-chikushino": "#2e7d32",
  "marukyo-harada": "#ad1457",
  "direx-hara": "#6a4c93",
};
const DEFAULT_STORE_COLOR = "#7a7266";

const STATUS_LABEL = {
  fetch_failed: "チラシページを取得できませんでした",
  no_image_found: "チラシ画像が見つかりませんでした",
  extract_failed: "AIによる読み取りに失敗しました",
  no_api_key: "価格の自動読み取り未設定です",
  no_items: "特売情報が見つかりませんでした",
};

const CATEGORY_ICON = {
  "精肉": "🥩",
  "鮮魚": "🐟",
  "野菜・果物": "🥬",
  "卵・乳製品": "🥚",
  "惣菜": "🍱",
  "飲料・お酒": "🍺",
  "日用品": "🧻",
  "その他": "🛒",
};

function storeColor(id) {
  return STORE_COLOR[id] || DEFAULT_STORE_COLOR;
}

function formatUpdatedAt(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", {
    year: "numeric", month: "long", day: "numeric", weekday: "short",
    hour: "2-digit", minute: "2-digit",
  });
}

function renderHero(data) {
  const container = document.getElementById("heroContainer");
  const storesWithItems = data.stores.filter(s => s.items && s.items.length > 0);
  if (storesWithItems.length === 0) return;

  const bestByCategory = [];
  data.categories.forEach(category => {
    let best = null;
    storesWithItems.forEach(store => {
      store.items
        .filter(it => it.category === category)
        .forEach(it => {
          if (!best || it.price < best.item.price) best = { store, item: it };
        });
    });
    if (best) bestByCategory.push({ category, ...best });
  });

  if (bestByCategory.length === 0) return;

  const heading = document.createElement("div");
  heading.className = "hero-heading";
  heading.textContent = "🔥 本日の最安ハイライト";
  container.appendChild(heading);

  const scroll = document.createElement("div");
  scroll.className = "hero-scroll";
  scroll.innerHTML = bestByCategory.map(({ category, store, item }) => {
    const color = storeColor(store.id);
    const icon = CATEGORY_ICON[category] || "🛒";
    return `
      <div class="hero-card" style="background:${color}">
        <div class="hero-icon">${icon}</div>
        <div class="hero-category">${escapeHtml(category)}</div>
        <div class="hero-name">${escapeHtml(item.name)}</div>
        <div class="hero-price">¥${item.price}<span class="hero-unit">${item.unit ? " " + escapeHtml(item.unit) : ""}</span></div>
        <div class="hero-store"><span class="hero-dot"></span>${escapeHtml(store.name)}</div>
      </div>
    `;
  }).join("");
  container.appendChild(scroll);
}

function renderCategories(data) {
  const container = document.getElementById("categoriesContainer");
  const storesWithItems = data.stores.filter(s => s.items && s.items.length > 0);

  if (storesWithItems.length === 0) {
    container.innerHTML = "";
    return;
  }

  data.categories.forEach(category => {
    const rows = storesWithItems
      .map(store => ({ store, items: store.items.filter(it => it.category === category) }))
      .filter(x => x.items.length > 0);

    if (rows.length === 0) return;

    const allPrices = rows.flatMap(r => r.items.map(it => it.price));
    const minPrice = Math.min(...allPrices);

    const section = document.createElement("div");
    section.className = "category-section";

    const cols = rows.map(({ store, items }) => {
      const color = storeColor(store.id);
      const itemsHtml = items.map(it => `
        <div class="item-row">
          <span class="item-name">${escapeHtml(it.name)}</span>
          <span class="item-price ${it.price === minPrice ? "cheapest" : ""}">¥${it.price}${it.unit ? `<span class="item-unit">${escapeHtml(it.unit)}</span>` : ""}</span>
        </div>
      `).join("");
      return `<div class="store-col" style="--store-color:${color}"><h4><span class="dot"></span>${escapeHtml(store.name)}</h4>${itemsHtml}</div>`;
    }).join("");

    const icon = CATEGORY_ICON[category] || "🛒";
    section.innerHTML = `
      <div class="category-title"><span class="badge">${icon}</span>${escapeHtml(category)}</div>
      <div class="category-grid">${cols}</div>
    `;
    container.appendChild(section);
  });
}

function renderFallback(data) {
  const container = document.getElementById("fallbackContainer");
  const needsFallback = data.stores.filter(s => !s.items || s.items.length === 0);

  if (needsFallback.length === 0) return;

  const heading = document.createElement("h2");
  heading.className = "section-heading";
  heading.textContent = "自動読み取りできなかった店舗（元チラシを直接確認）";
  container.appendChild(heading);

  needsFallback.forEach(store => {
    const el = document.createElement("div");
    el.className = "store";
    const statusText = STATUS_LABEL[store.status] || "情報を取得できませんでした";
    const linkLabel = STORE_LINK_LABEL[store.id] || "チラシを見る";
    el.innerHTML = `
      <div class="store-head">
        <h3>${escapeHtml(store.name)}</h3>
        <span class="status-na">${escapeHtml(statusText)}</span>
      </div>
      <div class="na-box">
        <a href="${store.sourceUrl}" target="_blank" rel="noopener">${linkLabel} →</a>
      </div>
    `;
    container.appendChild(el);
  });
}

function renderSourceLinks(data) {
  const container = document.getElementById("sourceLinksContainer");
  const heading = document.createElement("h2");
  heading.className = "section-heading";
  heading.textContent = "元チラシを直接確認する";
  container.appendChild(heading);

  const list = document.createElement("div");
  list.className = "source-links";
  list.innerHTML = data.stores.map(store => {
    const linkLabel = STORE_LINK_LABEL[store.id] || "チラシを見る";
    return `<a href="${store.sourceUrl}" target="_blank" rel="noopener">${escapeHtml(store.name)}：${linkLabel} →</a>`;
  }).join("");
  container.appendChild(list);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

fetch("data/flyers.json")
  .then(res => {
    if (!res.ok) throw new Error("data/flyers.json が見つかりません");
    return res.json();
  })
  .then(data => {
    document.getElementById("updatedLine").textContent = "最終更新: " + formatUpdatedAt(data.updatedAt);
    renderHero(data);
    renderCategories(data);
    renderFallback(data);
    renderSourceLinks(data);
  })
  .catch(err => {
    document.getElementById("updatedLine").textContent = "データを読み込めませんでした";
    document.getElementById("noticeBox").textContent =
      "data/flyers.json がまだ生成されていません。scripts/update-flyers.mjs を一度実行してください。";
    console.error(err);
  });
</script>
</body>
</html>
